[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "octavia-translation-evaluation-pipeline"
version = "1.0.0"
description = "Lightweight, reproducible translation quality evaluation pipeline for Octavia"
requires-python = ">=3.10"
dependencies = [
    "sacrebleu==2.4.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluator*"]