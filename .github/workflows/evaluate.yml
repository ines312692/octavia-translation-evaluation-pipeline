name: Evaluation Pipeline CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run evaluation pipeline
        id: evaluate
        run: |
          python evaluate.py \
            --source data/source.txt \
            --translation data/translation.txt \
            --output reports/report.json \
            --lang-pair en-es
        continue-on-error: true

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/report.json

      - name: Enforce pipeline decision
        if: steps.evaluate.outcome == 'failure'
        run: |
          echo "FINAL DECISION: FAIL — translation quality thresholds not met."
          exit 1